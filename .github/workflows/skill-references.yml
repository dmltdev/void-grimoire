name: Skill references

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skill-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
